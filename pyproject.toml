[project]
name = "ddd-sample-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
# 実行時に必要な依存パッケージ
dependencies = [
    "django>=6.0.3",
    "django-filter>=26.2",
    "djangorestframework>=3.17.1",
    "pyyaml>=6.0.3",
]

# 開発時のみ使う依存パッケージ（`uv sync` で既定でインストールされる）
[dependency-groups]
dev = [
    # Django の型スタブ。ty などの型チェッカーが `Model.objects` 等を解決できるようにする
    "django-stubs>=6.1.2",
    # モジュール間の import 依存ルールを検査する（`uv run lint-imports`）
    "import-linter>=2.13",
]

# ---------------------------------------------------------------------------
# import-linter: モジュール境界を import レベルで強制する設定
# ---------------------------------------------------------------------------
[tool.importlinter]
# 検査対象とするトップレベルパッケージ（＝各モジュール）
root_packages = [
    "shared",
    "menu",
    "customers",
    "ordering",
    "kitchen",
    "seating",
]
# django などの外部パッケージも依存グラフに含める（ドメイン層の Django 非依存チェックに必要）
include_external_packages = true

# menu の内部実装には他モジュールから直接触らせない。公開窓口は menu.public のみ
[[tool.importlinter.contracts]]
name = "menu's internals are only reachable through menu.public"
type = "forbidden"
source_modules = ["ordering", "kitchen", "customers", "seating"]
forbidden_modules = ["menu"]
# 例外として許可する import
ignore_imports = [
    "ordering.** -> menu.public",
    # テストのフィクスチャは、モジュールをまたいだ状態を準備するために他モジュールの
    # models へ直接触れてよい。public.py 経由を強制するのはプロダクションコードだけ。
    "ordering.tests.** -> menu.**",
]

# customers の内部実装には他モジュールから直接触らせない。公開窓口は customers.public のみ
[[tool.importlinter.contracts]]
name = "customers's internals are only reachable through customers.public"
type = "forbidden"
source_modules = ["ordering", "kitchen", "menu", "seating"]
forbidden_modules = ["customers"]
ignore_imports = [
    "ordering.** -> customers.public",
    # テストからの直接参照は許可
    "ordering.tests.** -> customers.**",
    "kitchen.tests.** -> customers.**",
]

# ordering の公開窓口は ordering.public と、購読用のドメインイベント ordering.domain.events のみ
[[tool.importlinter.contracts]]
name = "ordering's internals are only reachable through ordering.public or ordering.domain.events"
type = "forbidden"
source_modules = ["kitchen", "menu", "customers", "seating"]
forbidden_modules = ["ordering"]
# kitchen が ordering から受け取るのはイベントだけ（ordering.public は使わない）
ignore_imports = [
    "kitchen.** -> ordering.domain.events",
    "customers.** -> ordering.domain.events",
    # テストからの直接参照は許可
    "kitchen.tests.** -> ordering.**",
]

# kitchen の公開窓口は kitchen.public と、購読用のドメインイベント kitchen.domain.events のみ
[[tool.importlinter.contracts]]
name = "kitchen's internals are only reachable through kitchen.public or kitchen.domain.events"
type = "forbidden"
source_modules = ["ordering", "menu", "customers", "seating"]
forbidden_modules = ["kitchen"]
# ordering は kitchen.public も使わない（照会し合うと双方向の依存になるため。CONTEXT-MAP.md 参照）
ignore_imports = [
    "ordering.** -> kitchen.domain.events",
]

# seating の公開窓口は seating.public と、購読用のドメインイベント seating.domain.events のみ
[[tool.importlinter.contracts]]
name = "seating's internals are only reachable through seating.public or seating.domain.events"
type = "forbidden"
source_modules = ["ordering", "kitchen", "menu", "customers"]
forbidden_modules = ["seating"]
# ordering は席の利用開始 / 終了のイベントだけを購読する(席の会計を開く / 締める)
ignore_imports = [
    "ordering.** -> seating.domain.events",
    # テストからの直接参照は許可(席を使用中にしてから注文する、といった前提を作るため)
    "ordering.tests.** -> seating.**",
]

# ドメイン層は純粋な Python に保ち、Django に依存させない
[[tool.importlinter.contracts]]
name = "domain layers stay Django-free"
type = "forbidden"
source_modules = ["ordering.domain", "kitchen.domain", "seating.domain", "shared.domain"]
# seating の座席構成ファイルの読み込み(YAML)もドメインの外(infrastructure/layout_file.py)に置く
forbidden_modules = ["django", "yaml"]

# ordering の presentation は View を commands/(C)と queries/(Q)に分ける。
# 参照側の View はユースケースを呼ばず、コマンド側の View は参照用の queries.py を使わない。
[[tool.importlinter.contracts]]
name = "ordering query views do not call use cases"
type = "forbidden"
source_modules = ["ordering.presentation.queries"]
forbidden_modules = ["ordering.application.use_cases", "ordering.presentation.commands"]

[[tool.importlinter.contracts]]
name = "ordering command views do not read through queries"
type = "forbidden"
source_modules = ["ordering.presentation.commands"]
forbidden_modules = ["ordering.application.queries", "ordering.presentation.queries"]
